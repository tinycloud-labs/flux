apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: grafana
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: grafana
  onlyMappedSecrets: true
  map:
    - bwSecretId: 03189e93-0c0d-454d-81ee-b407002ed482
      secretKeyName: grafana-user
    - bwSecretId: f3c40b65-4be3-4306-9987-b4060166ca3b
      secretKeyName: grafana-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Discord webhook for the monitoring stack, separate from apps/discord-webhook (Flux
# events); Alertmanager reads it from /etc/alertmanager/secrets/discord-webhook/address
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: discord-webhook
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: discord-webhook
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: discord-webhook
  onlyMappedSecrets: true
  map:
    - bwSecretId: 3631a747-5d27-450c-abe2-b50800433aa3
      secretKeyName: address
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Dead Man's Snitch check-in URL (https://nosnch.in/<token>) for the Watchdog
# heartbeat; Alertmanager reads it from /etc/alertmanager/secrets/deadmanssnitch/url
# (clusters/prod/monitoring/prometheus/release.yaml)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: deadmanssnitch
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: deadmanssnitch
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: deadmanssnitch
  onlyMappedSecrets: true
  map:
    # Bitwarden secret "DEAD_MAN_URL"
    - bwSecretId: b5d58315-c126-4f43-a86c-b505002fb98e
      secretKeyName: url
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# SNMPv3 credentials for the Synology NAS, read by snmp-exporter as env vars
# (clusters/prod/monitoring/exporters/snmp-synology.yml expands ${SNMP_*}).
# A BitwardenSecret that never syncs fails the bw-secrets health check, which
# holds back every Kustomization that depends on bw-secrets
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: snmp-synology
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: snmp-synology
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: snmp-synology
  onlyMappedSecrets: true
  map:
    - bwSecretId: 1d94d5f8-31ed-4bb5-9ea0-b502008a1e0a
      secretKeyName: SNMP_USERNAME
    - bwSecretId: b1161c60-b4a5-4865-8a35-b502008a3f83
      secretKeyName: SNMP_AUTH_PASSWORD
    - bwSecretId: 1652098a-3dc1-4b1a-9283-b502008a6df2
      secretKeyName: SNMP_PRIV_PASSWORD
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Proxmox VE API token secret for pve-exporter (user monitoring@pve, token
# "prometheus", role PVEAuditor). The user and token name are plain env in
# clusters/prod/monitoring/exporters/release-pve.yaml; only the value is secret.
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: pve-exporter
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: pve-exporter
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: pve-exporter
  onlyMappedSecrets: true
  map:
    - bwSecretId: c9266ebb-05ff-428b-a6ae-b502008a8ffb
      secretKeyName: PVE_TOKEN_VALUE
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# SNMPv2c community for pfSense (bsnmpd only speaks v1/v2c), read by
# snmp-exporter as PFSENSE_SNMP_COMMUNITY (clusters/prod/monitoring/exporters/snmp-extra.yml).
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: snmp-pfsense
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: snmp-pfsense
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: snmp-pfsense
  onlyMappedSecrets: true
  map:
    - bwSecretId: 04b99a8a-434d-4f71-ac28-b502009be1aa
      secretKeyName: PFSENSE_SNMP_COMMUNITY
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# MaxMind GeoLite2 (free account) for alloy-geoip's geoipupdate init container
# (clusters/prod/monitoring/alloy/release-geoip.yaml).
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: maxmind-geoip
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: maxmind-geoip
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: maxmind-geoip
  onlyMappedSecrets: true
  map:
    - bwSecretId: 0aba6460-53e3-420a-8eee-b502009c104f
      secretKeyName: GEOIPUPDATE_ACCOUNT_ID
    - bwSecretId: a693d69f-7fd1-46af-87b7-b502009c53fb
      secretKeyName: GEOIPUPDATE_LICENSE_KEY
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Restic credentials for the VolSync backup of Grafana's disk
# (clusters/prod/monitoring/backups/grafana.yaml). RESTIC_REPOSITORY is the repo
# path inside the mover pod (the NAS repo share is mounted at /mnt/repo).
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: volsync-grafana-data
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: volsync-grafana-data
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: volsync-grafana-data
  onlyMappedSecrets: true
  map:
    # value: /mnt/repo/grafana-data
    # TODO: create this entry in Bitwarden and replace the placeholder ID. Until
    # then this secret never syncs and fails the bw-secrets health check
    - bwSecretId: 255655ec-e9e3-4e75-964d-b503006161eb
      secretKeyName: RESTIC_REPOSITORY
    # the shared restic password, same entry as volsync-jellyfin-config (apps namespace)
    - bwSecretId: dd4e9a66-a9d3-49fc-84d1-b502002cb6c2
      secretKeyName: RESTIC_PASSWORD
  authToken:
    secretName: bw-auth-token
    secretKey: token
