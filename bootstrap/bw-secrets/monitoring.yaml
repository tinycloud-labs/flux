apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: grafana
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: grafana
  onlyMappedSecrets: true
  map:
    - bwSecretId: 03189e93-0c0d-454d-81ee-b407002ed482
      secretKeyName: grafana-user
    - bwSecretId: f3c40b65-4be3-4306-9987-b4060166ca3b
      secretKeyName: grafana-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Same Discord webhook as apps/discord-webhook (Flux events); Alertmanager reads it
# from /etc/alertmanager/secrets/discord-webhook/address
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: discord-webhook
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: discord-webhook
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: discord-webhook
  onlyMappedSecrets: true
  map:
    - bwSecretId: a677efc5-c46b-41bc-a638-b48d00883466
      secretKeyName: address
  authToken:
    secretName: bw-auth-token
    secretKey: token
