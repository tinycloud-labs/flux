apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: grafana
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: grafana
  onlyMappedSecrets: true
  map:
    - bwSecretId: 03189e93-0c0d-454d-81ee-b407002ed482
      secretKeyName: grafana-user
    - bwSecretId: f3c40b65-4be3-4306-9987-b4060166ca3b
      secretKeyName: grafana-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Same Discord webhook as apps/discord-webhook (Flux events); Alertmanager reads it
# from /etc/alertmanager/secrets/discord-webhook/address
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: discord-webhook
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: discord-webhook
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: discord-webhook
  onlyMappedSecrets: true
  map:
    - bwSecretId: a677efc5-c46b-41bc-a638-b48d00883466
      secretKeyName: address
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# SNMPv3 credentials for the Synology NAS, read by snmp-exporter as env vars
# (clusters/prod/monitoring/exporters/snmp-synology.yml expands ${SNMP_*}).
# TODO before merge: replace the REPLACE-ME ids with the Bitwarden secret ids.
# A BitwardenSecret that never syncs fails the bw-secrets health check, which
# holds back every Kustomization that depends on bw-secrets
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: snmp-synology
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: snmp-synology
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: snmp-synology
  onlyMappedSecrets: true
  map:
    - bwSecretId: REPLACE-ME-synology-snmp-username
      secretKeyName: SNMP_USERNAME
    - bwSecretId: REPLACE-ME-synology-snmp-auth-password
      secretKeyName: SNMP_AUTH_PASSWORD
    - bwSecretId: REPLACE-ME-synology-snmp-priv-password
      secretKeyName: SNMP_PRIV_PASSWORD
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
# Proxmox VE API token secret for pve-exporter (user monitoring@pve, token
# "prometheus", role PVEAuditor). The user and token name are plain env in
# clusters/prod/monitoring/exporters/release-pve.yaml; only the value is secret.
# TODO before merge: replace the REPLACE-ME id with the Bitwarden secret id
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: pve-exporter
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: pve-exporter
  namespace: monitoring
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: pve-exporter
  onlyMappedSecrets: true
  map:
    - bwSecretId: REPLACE-ME-pve-exporter-token-value
      secretKeyName: PVE_TOKEN_VALUE
  authToken:
    secretName: bw-auth-token
    secretKey: token
