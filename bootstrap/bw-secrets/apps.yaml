# NetAlertX API token: NetAlertX reads it (API_TOKEN via APP_CONF_OVERRIDE) and
# Prometheus sends it to scrape /metrics (ServiceMonitor in apps/netalertx).
# Any long random string
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: netalertx-api-token
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: flux
  name: netalertx-api-token
  namespace: apps
spec:
  organizationId: 7cf8a916-b01f-49d2-945c-b3d5005679cf
  secretName: netalertx-api-token
  onlyMappedSecrets: true
  map:
    - bwSecretId: 67a2eb63-bfa9-4507-92c2-b508016d77b0
      secretKeyName: token
  authToken:
    secretName: bw-auth-token
    secretKey: token
