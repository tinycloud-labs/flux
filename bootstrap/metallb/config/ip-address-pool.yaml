apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
  labels:
    app.kubernetes.io/component: metallb
    app.kubernetes.io/part-of: bootstrap
spec:
  # Reserved in pfSense's DHCP, so nothing else on the LAN is handed these.
  # In use: .95 Traefik, .96 syslog (alloy-syslog-lan), .97 Plex
  addresses:
    - 10.10.50.90-10.10.50.99
