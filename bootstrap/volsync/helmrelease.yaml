apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: flux-system
  labels:
    app.kubernetes.io/component: volsync
    app.kubernetes.io/part-of: bootstrap
spec:
  # Backs up Proxmox CSI PVCs with restic into a repository on the Synology (NFS).
  # Chart values ref https://github.com/backube/volsync/blob/main/helm/volsync/values.yaml
  interval: 10m
  releaseName: volsync
  targetNamespace: volsync-system
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # The chart ships a ServiceMonitor without a bearer token (Prometheus gets 401 ->
  # TargetDown), rendered only if its CRD already exists, so it's missing after a
  # fresh rebuild. It's dropped here; the scrape lives in
  # clusters/prod/monitoring/prometheus-config/servicemonitor-volsync.yaml instead.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
              name: volsync
            patch: |
              $patch: delete
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: volsync
