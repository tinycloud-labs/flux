apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sm-operator
  namespace: sm-operator-system
  labels:
    app.kubernetes.io/component: sm-operator
    app.kubernetes.io/part-of: bootstrap
spec:
  interval: 10m
  releaseName: sm-operator
  targetNamespace: sm-operator-system
  chart:
    spec:
      chart: sm-operator
      version: 2.0.3
      sourceRef:
        kind: HelmRepository
        name: bw-secrets-manager
        namespace: flux-system
  values:
    settings:
      # Seconds between syncs with Bitwarden for each BitwardenSecret. Fixes aggrisve fetch and rate-limit deadlocks
      bwSecretsManagerRefreshInterval: 3600
    containers:
      manager:
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
