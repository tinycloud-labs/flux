apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-proxmox
  namespace: csi-proxmox
  labels:
    app.kubernetes.io/component: csi-driver-proxmox
    app.kubernetes.io/part-of: bootstrap
spec:
  interval: 10m
  releaseName: csi-driver-proxmox
  targetNamespace: csi-proxmox
  chart:
    spec:
      chart: proxmox-csi-plugin
      version: 0.5.12
      sourceRef:
        kind: HelmRepository
        name: proxmox-csi-plugin
        namespace: flux-system
  # Chart values ref https://github.com/sergelogvinov/proxmox-csi-plugin/blob/main/charts/proxmox-csi-plugin/values.yaml
  values:
    existingConfigSecret: proxmox-csi-plugin
    existingConfigSecretKey: config.yaml

    # Define the storage classes some FIELDS ARE IMMUTABLE. And updated value requires destroy & redeploy
    storageClass:
      - name: proxmox-delete
        storage: tank
        reclaimPolicy: Delete
        fstype: xfs
        ssd: true
        # annotations:
        #  storageclass.kubernetes.io/is-default-class: "true"
      - name: proxmox-retain
        storage: tank
        reclaimPolicy: Retain
        fstype: xfs
        ssd: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
