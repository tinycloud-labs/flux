apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bw-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/component: bw-secrets
    app.kubernetes.io/part-of: bootstrap
spec:
  # Reconciles all BitwardenSecret objects (sm-operator turns them into Secrets).
  interval: 1h
  path: ./bootstrap/bw-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sm-operator
  # Ready only once every BitwardenSecret has synced at least once, so a secret
  # that can't sync (e.g. invalid_client from an expired machine-account token)
  # fails here, with the operator's error, and the Flux Discord alert fires,
  # instead of a downstream HelmRelease timing out on a missing Secret.
  # Staleness of secrets that synced before is alerted by Prometheus
  # (BitwardenSyncFailing, from the operator's reconcile-error metrics): the
  # status only moves when a value changes, and CEL here has no clock anyway.
  wait: true
  timeout: 5m
  healthCheckExprs:
    - apiVersion: k8s.bitwarden.com/v1
      kind: BitwardenSecret
      failed: "!has(status.lastSuccessfulSyncTime) && has(status.conditions) && status.conditions.exists(c, c.type == 'FailedSync')"
      current: "has(status.lastSuccessfulSyncTime)"
