# Entry point for the monitoring stack, reconciled by the `monitoring` Flux
# Kustomization (clusters/prod/monitoring.yaml), which waits for helm-repos,
# bw-secrets, CSI drivers and metallb-config.
# Each file below is a child Flux Kustomization; dependsOn orders them:
#
#   monitoring-prometheus ─┬─> monitoring-loki ──> monitoring-alloy
#                          ├─> monitoring-dashboards
#                          └─> monitoring-exporters
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - monitoring-prometheus.yaml
  - monitoring-loki.yaml
  - monitoring-alloy.yaml
  - monitoring-dashboards.yaml
  - monitoring-exporters.yaml
