apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-exporters
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  # Exporters for the Synology NAS (SNMP) and Proxmox VE (API). Needs the
  # ServiceMonitor/PrometheusRule CRDs and Prometheus from monitoring-prometheus
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  path: ./clusters/prod/monitoring/exporters
  prune: true
  # Ready only when every object (incl. HelmReleases) is Ready, so a dependsOn on
  # this means "after it is running", not just "after it was applied"
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: monitoring-prometheus
