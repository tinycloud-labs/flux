# Extra snmp_exporter config, loaded next to the image's built-in snmp.yml
# (both passed as --config.file; modules/auths are merged).
#
# ${...} are expanded from the pod env (--config.expand-environment-variables),
# which comes from Secrets synced by BitwardenSecrets in
# bootstrap/bw-secrets/monitoring.yaml:
#   auths.synology_v3: SNMPv3 authPriv      <- Secret snmp-synology
#   auths.pfsense_v2:  SNMPv2c community    <- Secret snmp-pfsense
#     (pfSense's built-in bsnmpd only speaks v1/v2c; it is bound to the LAN
#      interface and read-only, and the community is kept out of git)
#
# modules.synology_health: the upstream `synology` module (snmp_exporter v0.31.0)
# trimmed to SYNOLOGY-SYSTEM/DISK/RAID/STORAGEIO/SPACEIO-MIB. Dropped on purpose:
# the per-disk SMART attribute table (6574.5: large, and polling it can keep
# HDDs awake), UPS (6574.4), services (6574.6), iSCSI (6574.104).
# Disk health is still covered by diskStatus/diskHealthStatus/diskBadSector/
# diskRemainLife from the DISK-MIB.
#
# Regenerate after an snmp_exporter bump:
#   docker run --rm --entrypoint cat quay.io/prometheus/snmp-exporter:<ver> /etc/snmp_exporter/snmp.yml > snmp.yml
#   KEEP='^1\.3\.6\.1\.4\.1\.6574\.(1|2|3|101|102)(\.|$)'
#   yq ".modules.synology | {\"walk\": [.walk[] | select(test(\"$KEEP\"))], \"metrics\": [.metrics[] | select(.oid | test(\"$KEEP\"))]}" snmp.yml
auths:
  synology_v3:
    version: 3
    security_level: authPriv
    username: ${SNMP_USERNAME}
    password: ${SNMP_AUTH_PASSWORD}
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: ${SNMP_PRIV_PASSWORD}
  pfsense_v2:
    version: 2
    community: ${PFSENSE_SNMP_COMMUNITY}
modules:
  synology_health:
    walk:
      - 1.3.6.1.4.1.6574.1
      - 1.3.6.1.4.1.6574.101
      - 1.3.6.1.4.1.6574.102
      - 1.3.6.1.4.1.6574.2
      - 1.3.6.1.4.1.6574.3
    metrics:
      - name: systemStatus
        oid: 1.3.6.1.4.1.6574.1.1
        type: gauge
        help: Synology system status Each meanings of status represented describe below - 1.3.6.1.4.1.6574.1.1
      - name: temperature
        oid: 1.3.6.1.4.1.6574.1.2
        type: gauge
        help: Synology system temperature The temperature of Disk Station uses Celsius degree. - 1.3.6.1.4.1.6574.1.2
      - name: powerStatus
        oid: 1.3.6.1.4.1.6574.1.3
        type: gauge
        help: Synology power status Each meanings of status represented describe below - 1.3.6.1.4.1.6574.1.3
