# SNMP exporter: polls the Synology NAS (SNMPv3) and pfSense (SNMPv2c). Nothing is
# installed on either device.
# Config: the image's built-in snmp.yml (if_mib, hrStorage, hrDevice, system) plus
# ./snmp-extra.yml (auths + trimmed synology_health module).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  interval: 1h0m0s
  releaseName: snmp-exporter
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: "9.21.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 2h0m0s

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    # Only overrides are listed; see `helm show values prometheus-snmp-exporter --repo https://prometheus-community.github.io/helm-charts`
    extraArgs:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp-extra/snmp-extra.yml
      # pfSense SNMPv2c auth, rendered by the init container below
      - --config.file=/etc/snmp-rendered/pfsense-auth.yml
      # ${SNMP_*} in snmp-extra.yml come from the snmp-synology Secret
      - --config.expand-environment-variables

    envFrom:
      - secretRef:
          name: snmp-synology

    # snmp_exporter does not expand env vars in a v2c `community`, so the pfSense
    # auth is written to a file at pod start. The volume is in memory: the
    # community never touches a disk, and nothing is written per scrape.
    # Changing the community in Bitwarden needs a pod restart (same as env vars).
    extraInitContainers:
      - name: render-pfsense-auth
        image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 # renovate: depName=busybox
        env:
          - name: PFSENSE_SNMP_COMMUNITY
            valueFrom:
              secretKeyRef:
                name: snmp-pfsense
                key: PFSENSE_SNMP_COMMUNITY
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            # YAML double-quoted string: escape \ and "
            c=$(printf '%s' "$PFSENSE_SNMP_COMMUNITY" | sed 's/\\/\\\\/g; s/"/\\"/g')
            printf 'auths:\n  pfsense_v2:\n    version: 2\n    community: "%s"\n' "$c" > /rendered/pfsense-auth.yml
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: snmp-rendered
            mountPath: /rendered
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi

    extraVolumes:
      - name: snmp-rendered
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi

    extraVolumeMounts:
      - name: snmp-rendered
        mountPath: /etc/snmp-rendered
        readOnly: true

    extraConfigmapMounts:
      - name: snmp-extra
        mountPath: /etc/snmp-extra
        configMap: snmp-exporter-extra
        readOnly: true

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

    serviceMonitor:
      enabled: true
      # chart default selector (prometheus: kube-prometheus) is irrelevant: Prometheus
      # selects every ServiceMonitor (serviceMonitorSelectorNilUsesHelmValues: false)
      selector: {}
      auth:
        - synology_v3
      scrapeTimeout: 50s
      params:
        # Health (system/fans/PSU/disks/RAID/IO). Every 3 minutes, not 60s: lighter on
        # the NAS and less likely to keep idle HDDs from hibernating. 3m stays under
        # Prometheus' 5m staleness window, so series never go stale between scrapes
        - name: synology-health
          target: synology.shakir.cloud
          module:
            - synology_health
          interval: 3m
          # Both scrapes hit the same Service; without distinct job labels their
          # `up` series would be identical and collide
          relabelings:
            - targetLabel: job
              replacement: synology-health
            - targetLabel: instance
              replacement: synology.shakir.cloud  # matches the chart's metric relabel
        # Interfaces, volume/memory usage (filesystem stats, no disk access), uptime
        - name: synology-system
          target: synology.shakir.cloud
          module:
            - if_mib
            - hrStorage
            - system
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - targetLabel: job
              replacement: synology-system
            - targetLabel: instance
              replacement: synology.shakir.cloud  # matches the chart's metric relabel
        # pfSense: interface traffic/errors (WAN bandwidth), CPU load, memory, uptime
        - name: pfsense
          target: pfsense.shakir.cloud
          auth: [pfsense_v2]
          module:
            - if_mib
            - hrStorage
            - hrDevice
            - system
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - targetLabel: job
              replacement: pfsense
            - targetLabel: instance
              replacement: pfsense.shakir.cloud  # matches the chart's metric relabel
