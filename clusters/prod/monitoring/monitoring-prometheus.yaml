apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-prometheus
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  # Prometheus, Alertmanager, Grafana, exporters + CRDs (installed/upgraded by the HelmRelease)
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  path: ./clusters/prod/monitoring/prometheus
  prune: true
  # Ready only when every object (incl. HelmReleases) is Ready, so a dependsOn on
  # this means "after it is running", not just "after it was applied"
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
