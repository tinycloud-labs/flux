# The same restic repository share as apps/volsync-repo, for this namespace:
# a mover can only mount PVCs from its own namespace. The PV is cluster-scoped,
# hence the distinct name. Mounted into the mover pod at /mnt/repo.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync-repo-monitoring
  namespace: monitoring
spec:
  interval: 1h0m0s
  releaseName: volsync-repo-monitoring
  chart:
    spec:
      chart: storage
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    labels:
      app: volsync
    annotations:
      volume.kubernetes.io/description: "Restic repositories for VolSync backups of Proxmox CSI volumes"

    persistence:
      name: volsync-repo-monitoring
      size: 100Gi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/volsync
