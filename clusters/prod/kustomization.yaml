# native Kustomize entrypoint for the prod cluster.
# It lists every Flux Kustomization CRD that Flux should reconcile.
# Flux watches this directory and applies whatever is listed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flux-system
  - helm-repos.yaml
  - csi-driver-nfs.yaml
  - sm-operator.yaml
  - metallb.yaml
  - metallb-config.yaml
  - bw-secrets.yaml
  - csi-driver-proxmox.yaml
  # - volsync.yaml  # VolSync disabled: worker VMs need an x86-64-v2 CPU type
  - apps.yaml
  - monitoring.yaml
