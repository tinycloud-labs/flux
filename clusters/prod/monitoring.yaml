apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  # Applies the monitoring stack's child Flux Kustomizations (see
  # ./monitoring/kustomization.yaml for their order).
  # Needs: chart sources, the grafana + discord-webhook secrets (bw-secrets),
  # proxmox-delete volumes for Prometheus/Alertmanager/Loki (csi-driver-proxmox),
  # and the MetalLB pool for the syslog LoadBalancer IP
  interval: 10m
  path: ./clusters/prod/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: helm-repos
    - name: metallb-config
    - name: csi-driver-proxmox
    - name: bw-secrets
