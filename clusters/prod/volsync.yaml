apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: flux-system
  labels:
    app.kubernetes.io/component: volsync
    app.kubernetes.io/part-of: bootstrap
spec:
  # Deploys the VolSync operator. VolSync requires the snapshot controller,
  # which csi-driver-nfs installs (externalSnapshotter.enabled).
  interval: 10m
  path: ./bootstrap/volsync
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: helm-repos
    - name: csi-driver-nfs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: volsync
      namespace: flux-system
