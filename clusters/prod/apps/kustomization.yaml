apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#	Kubernetes namespace in kustomization.yaml
namespace: apps

resources:
  - ../../../apps/actualbudget
  - ../../../apps/bentopdf
  - ../../../apps/carlogger
  - ../../../apps/deemix
  - ../../../apps/excalidraw
  - ../../../apps/forgejo
  # - ../../../apps/gaseous  # Gaseous disabled: its MariaDB fills the ZFS zvol (no housekeeping)
  - ../../../apps/headlamp
  - ../../../apps/homepage
  - ../../../apps/jellyfin
  - ../../../apps/linkwarden
  - ../../../apps/meilisearch
  - ../../../apps/metube
  - ../../../apps/omni-tools
  - ../../../apps/paperless-ngx
  # - ../../../apps/volsync-repo  # VolSync disabled: worker VMs need an x86-64-v2 CPU type
  - ../notifications

patches:
  - target:
      kind: HelmRelease
    path: common-patch.yaml
