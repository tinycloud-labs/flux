apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: linkwarden

  chart:
    spec:
      chart: unichart
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: linkwarden
      replicaCount: 1
      image:
        repository: ghcr.io/linkwarden/linkwarden
        pullPolicy: IfNotPresent
        tag: v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46 # renovate: depName=ghcr.io/linkwarden/linkwarden

      ports:
        - containerPort: 3000
      service:
        ports:
          - port: 80
            targetPort: 3000

      volumeMounts:
        - mountPath: /data/data
          subPath: data

      dbHostname: postgres-unichart

      envFromSecrets:
        enabled: true
        secretRefNames:
          - meilisearch
          - linkwarden

      env:
        - name: NEXTAUTH_URL
          value: "http://localhost:3000/api/v1/auth"
        - name: MEILI_HOST
          value: "meilisearch-unichart.apps.svc.cluster.local:7700"

    ingress:
      enabled: true
      host: "linkwarden.shakir.cloud"
      ingressClassName: "traefik"
      port: 80

    ## ------------ StatefulSet Specifications ------------ ##
    database:
      replicaCount: 1
      enabled: true
      host: postgres-unichart
      port: 5432

      env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "trust"

      image:
        repository: postgres
        tag: "16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36"

      volumeMounts:
        - mountPath: /var/lib/postgresql/data
          subPath: pgdata

    ## ------------ Persistence ------------ ##
    persistence:
      # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
      app:
        enabled: true
        size: 200Mi
        accessMode: ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
        nfs:
          server: synology.shakir.cloud
          path: /volume1/k3s-main/linkwarden

      # -- Database (StatefulSet): moves to Proxmox CSI, one disk per replica via volumeClaimTemplates --
      # Binds to an existing disk
      database:
        size: 512Mi
        accessMode: ReadWriteOnce
        storageClassName: proxmox-retain
        # Pinned to the existing disk, so a rebuild rebinds it instead of provisioning a new one
        existingVolume:
          handle: "homelab/pve1/tank/vm-9999-pvc-7cc5d7d1-b8f7-4de8-9d47-017ff6000eab"
          fsType: xfs
          volumeAttributes:
            backup: "0"
            discard: "on"
            iothread: "1"
            replicate: "0"
            ssd: "1"
            storage: "tank"
