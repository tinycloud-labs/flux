app:
  name: linkwarden
  image:
    repository: ghcr.io/linkwarden/linkwarden
    pullPolicy: IfNotPresent
    tag: latest

  service:
    port: 80
    targetPort: 3000

  volumeMounts:
    - mountPath: /data/data
      subPath: data

  dbHostname: postgres-unichart

  envFromSecrets:
    enabled: true
    secretRefNames:
      - meilisearch
      - linkwarden
  env:
    - name: NEXTAUTH_URL
      value: "http://localhost:3000/api/v1/auth	"
    - name: MEILI_HOST
      value: "meilisearch-unichart.apps.svc.cluster.local"

## ------------ StatefulSet Specifications ------------ ##
database:
  enabled: true
  host: postgres-unichart
  port: 5432
  image:
    repository: postgres
    tag: 18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  volumeMounts:
    - mountPath: /var/lib/postgresql/data
      subPath: pgdata
  securityContext:
    enabled: true
    runAsUser: 999
    runAsGroup: 999
#    runAsNonRoot: false
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
