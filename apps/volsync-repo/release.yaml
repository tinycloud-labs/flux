# Restic repository share on the Synology, mounted into every VolSync mover pod at /mnt/repo.
# Each backed-up PVC keeps its own restic repository in a subfolder (see bootstrap/bw-secrets/volsync.yaml).
# The folder must exist on the NAS before the first backup.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync-repo
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: volsync-repo
  chart:
    spec:
      chart: storage
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    labels:
      app: volsync
    annotations:
      volume.kubernetes.io/description: "Restic repositories for VolSync backups of Proxmox CSI volumes"

    persistence:
      name: volsync-repo
      size: 100Gi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/volsync
