apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: excalidraw

spec:
  interval: 1h0m0s
  releaseName: excalidraw

  chart:
    spec:
      chart: unichart
      version: "0.0.7"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: excalidraw
      replicaCount: 1
      image:
        repository: excalidraw/excalidraw
        pullPolicy: IfNotPresent
        tag: latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9 # renovate: depName=excalidraw/excalidraw

      containerPort: 80

      service:
        port: 80
        targetPort: 80
    ingress:
      enabled: true
      host: draw.shakir.cloud
      ingressClassName: traefik
