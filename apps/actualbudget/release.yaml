apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualbudget
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: actualbudget

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: actualbudget
      replicaCount: 1
      image:
        repository: docker.io/actualbudget/actual-server
        pullPolicy: IfNotPresent
        tag: latest@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c # renovate: depName=docker.io/actualbudget/actual-server datasource=docker

      ports:
        - containerPort: 5006
      service:
        ports:
          - port: 80
            targetPort: 5006

      volumeMounts:
        - mountPath: /data
          subPath: data

      livenessProbe:
        enabled: true
        command: ["node", "src/scripts/health-check.js"]
        initialDelaySeconds: 20
        periodSeconds: 60
        timeoutSeconds: 10
        failureThreshold: 3

    ingress:
      enabled: true
      host: budget.shakir.cloud
      ingressClassName: traefik
    persistence:
      # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
      app:
        enabled: true
        # Keeps the PV/PVC name used before unichart 1.0.0 (default is now <release>-unichart-app-data)
        name: actualbudget-unichart
        size: 200Mi
        accessMode: ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
        nfs:
          server: synology.shakir.cloud
          path: /volume1/k3s-main/actualbudget
