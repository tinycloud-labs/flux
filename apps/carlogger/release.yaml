apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lubelogger
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: lubelogger

  chart:
    spec:
      chart: lubelogger
      version: "1.4.1"
      sourceRef:
        kind: HelmRepository
        name: anza-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    # Only overrides are listed; see `helm show values lubelogger --repo https://anza-labs.github.io/charts`
    image:
      repository: ghcr.io/hargata/lubelogger
      tag: "v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2"

    curl:
      image:
        repository: docker.io/curlimages/curl
        tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"

    config:
      userConfig:
        UseDarkMode: true
        EnableAuth: false
        UseMarkDownOnSavedNotes: true

    # Mail connection (placeholder values)
    secret:
      name: "joedoe"
      emailServer: "joedoe@joedoe.com"
      emailFrom: "joedoe@joedoe.com"
      username: "joedoe"
      password: "joedoe"

    persistence:
      data:
        enabled: true
        storageClass: "nfs-client"
        size: 100Mi

    ingress:
      enabled: true
      className: "traefik"
      hosts:
        - host: car.shakir.cloud
          paths:
            - path: /
              pathType: ImplementationSpecific
