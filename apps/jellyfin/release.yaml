apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: jellyfin
  # Storage releases must be Ready before Jellyfin installs or upgrades
  dependsOn:
    - name: jellyfin-media-nfs
      namespace: apps
    - name: jellyfin-config-csi
      namespace: apps
  chart:
    spec:
      chart: jellyfin
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
      interval: 2h0m0s

  values:
    # Only overrides are listed; see `helm show values jellyfin --repo https://jellyfin.github.io/jellyfin-helm`
    image:
      repository: docker.io/jellyfin/jellyfin
      tag: "10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db"

    ingress:
      enabled: true
      className: "traefik"
      hosts:
        - host: jellyfin.shakir.cloud
          paths:
            - path: /
              pathType: ImplementationSpecific

    # The config disk is ReadWriteOnce, so the old pod must release it before the new one starts
    deploymentStrategy:
      type: Recreate

    # PVCs come from the storage releases below
    persistence:
      config:
        existingClaim: jellyfin-config-csi
      media:
        existingClaim: jellyfin-media-nfs

---
# Media stays on the NAS
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-media-nfs
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: jellyfin-media-nfs
  chart:
    spec:
      chart: storage
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  # Static NFS binds immediately, so the default wait holds Jellyfin until the PVC is Bound
  values:
    labels:
      app: jellyfin
    annotations:
      volume.kubernetes.io/description: "Shared PVC for jellyfin-media"
      custom.synology/path-hint: "maps to /vol1/k3s-main/jellyfin-media"

    persistence:
      name: jellyfin-media-nfs
      size: 100Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/pv-jellyfin-media

---
# Jellyfin config and SQLite database, on a Proxmox CSI disk
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-config-csi
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: jellyfin-config-csi
  chart:
    spec:
      chart: storage
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  # The PVC only binds once Jellyfin's pod uses it (WaitForFirstConsumer).
  # Waiting here would deadlock with the dependsOn on the jellyfin release.
  install:
    disableWait: true
  upgrade:
    disableWait: true

  values:
    labels:
      app: jellyfin
    annotations:
      volume.kubernetes.io/description: "Jellyfin config and SQLite database"

    persistence:
      name: jellyfin-config-csi
      size: 5Gi
      accessMode: ReadWriteOnce
      storageClassName: proxmox-retain
      # After the first install, capture the disk and pin it here so a rebuild rebinds it:
      # existingVolume:
      #   handle: ""
      #   fsType: xfs
      #   volumeAttributes: {}
      existingVolume:
        handle: "homelab/pve1/tank/vm-9999-pvc-324a7d7b-714f-4d8a-ad74-f96b4a31d055"
        fsType: xfs
        volumeAttributes:
          backup: "0"
          discard: "on"
          iothread: "1"
          replicate: "0"
          ssd: "1"
          storage: tank
