apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: jellyfin
  dependsOn:
    - name: jellyfin-media
      namespace: apps
    - name: jellyfin-config
      namespace: apps
  chart:
    spec:
      chart: jellyfin
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
      interval: 2h0m0s

  values:
    # Only overrides are listed; see `helm show values jellyfin --repo https://jellyfin.github.io/jellyfin-helm`
    image:
      repository: docker.io/jellyfin/jellyfin
      tag: "10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db"

    ingress:
      enabled: true
      className: "traefik"
      hosts:
        - host: jellyfin.shakir.cloud
          paths:
            - path: /
              pathType: ImplementationSpecific

    # PVCs come from the jellyfin-config / jellyfin-media releases below
    persistence:
      config:
        existingClaim: jellyfin-config
      media:
        existingClaim: jellyfin-media

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-media
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: jellyfin-media
  chart:
    spec:
      chart: nfspersistence
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    labels:
      app: jellyfin
    annotations:
      volume.kubernetes.io/description: "Shared PVC for jellyfin-media"
      custom.synology/path-hint: "maps to /vol1/k3s-main/jellyfin-media"

    persistence:
      name: jellyfin-media
      size: 100Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/pv-jellyfin-media

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-config
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: jellyfin-config
  chart:
    spec:
      chart: nfspersistence
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    labels:
      app: jellyfin
    annotations:
      volume.kubernetes.io/description: "Shared PVC for jellyfin-config"
      custom.synology/path-hint: "maps to /vol1/k3s-main/jellyfin-config"

    persistence:
      name: jellyfin-config
      size: 100Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/pv-jellyfin-config
