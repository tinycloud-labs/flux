apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deemix
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: deemix

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: deemix
      replicaCount: 1
      image:
        repository: ghcr.io/bambanah/deemix
        pullPolicy: IfNotPresent
        tag: v4.8.0@sha256:aff6120619685b339a704b49bec13469684dbec2c7e39cd7bdf0014217dd1d0a

      ports:
        - containerPort: 6595
      service:
        ports:
          - port: 80
            targetPort: 6595

      volumeMounts:
        - mountPath: /downloads
          subPath: downloads
        - mountPath: /config
          subPath: config

      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: UMASK_SET
          value: "022"
        - name: DEEMIX_SINGLE_USER
          value: "true"

    ingress:
      enabled: true
      host: deemix.shakir.cloud
      ingressClassName: traefik

    persistence:
      # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
      app:
        enabled: true
        # Keeps the PV/PVC name used before unichart 1.0.0 (default is now <release>-unichart-app-data)
        name: deemix-unichart
        size: 200Mi
        accessMode: ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
        nfs:
          server: synology.shakir.cloud
          path: /volume1/k3s-main/deemix
