apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bentopdf
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: bentopdf

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s
  values:
    app:
      name: bentopdf
      replicaCount: 1
      image:
        repository: ghcr.io/alam00000/bentopdf
        pullPolicy: IfNotPresent
        tag: 2.8.10@sha256:039239902a01e58a5a0f52e29039fafa18ffc2a481bb8acd807599f1c6dde7ef # renovate: depName=ghcr.io/alam00000/bentopdf
      ports:
        - containerPort: 8080
      service:
        ports:
          - port: 80
            targetPort: 8080

    ingress:
      enabled: true
      host: bentopdf.shakir.cloud
      ingressClassName: traefik

    ## ------------ Persistence ------------ ##
    persistence:
      app:
        enabled: false
