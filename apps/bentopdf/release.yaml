apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bentopdf
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: bentopdf

  chart:
    spec:
      chart: unichart
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s
  values:
    app:
      name: bentopdf
      replicaCount: 1
      image:
        repository: ghcr.io/alam00000/bentopdf
        pullPolicy: IfNotPresent
        tag: 2.8.12@sha256:beec9d0e0ccb96e59dbff6d26bd7c954c89c880a8c0be5c85004ecc707736516 # renovate: depName=ghcr.io/alam00000/bentopdf
      ports:
        - containerPort: 8080
      service:
        ports:
          - port: 80
            targetPort: 8080

    ingress:
      enabled: true
      host: bentopdf.shakir.cloud
      ingressClassName: traefik

    ## ------------ Persistence ------------ ##
    persistence:
      app:
        enabled: false
