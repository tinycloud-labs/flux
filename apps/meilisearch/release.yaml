apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: meilisearch

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: meilisearch
      replicaCount: 1
      image:
        repository: getmeili/meilisearch
        pullPolicy: IfNotPresent
        tag: v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb

      ports:
        - containerPort: 7700
      service:
        ports:
          - port: 7700
            targetPort: 7700

      volumeMounts:
        - mountPath: /meili_data
          subPath: meili_data

      envFromSecrets:
        enabled: true
        secretRefNames:
          - meilisearch

    ingress:
      enabled: true
      host: meilisearch.shakir.cloud
      port: 7700
      ingressClassName: traefik

    persistence:
      # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
      app:
        enabled: true
        # Keeps the PV/PVC name used before unichart 1.0.0 (default is now <release>-unichart-app-data)
        name: meilisearch-unichart
        size: 200Mi
        accessMode: ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
        nfs:
          server: synology.shakir.cloud
          path: /volume1/k3s-main/meilisearch
