apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: meilisearch

  chart:
    spec:
      chart: unichart
      version: "0.0.7"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: meilisearch
      replicaCount: 1
      image:
        repository: getmeili/meilisearch
        pullPolicy: IfNotPresent
        tag: v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c

      service:
        port: 7700
        targetPort: 7700

      volumeMounts:
        - mountPath: /meili_data
          subPath: meili_data

      envFromSecrets:
        enabled: true
        secretRefNames:
          - meilisearch

    ingress:
      enabled: true
      host: meilisearch.shakir.cloud
      ingressClassName: traefik

    persistence:
      enabled: true
      size: 200Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/meilisearch
