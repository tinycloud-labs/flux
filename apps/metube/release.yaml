apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metube
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: metube

  chart:
    spec:
      chart: unichart
      version: "0.0.7"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: metube
      replicaCount: 1
      image:
        repository: ghcr.io/alexta69/metube
        pullPolicy: IfNotPresent
        tag: "2026.10.23@sha256:367d9d1b5122f2e88263a689998f8b11c4e9a188c9cbdace0ace8bd197935ad8" # renovate: depName=ghcr.io/alexta69/metube

      containerPort: 80

      service:
        port: 80
        targetPort: 8081

      volumeMounts:
        - mountPath: /downloads
          subPath: downloads

    ingress:
      enabled: true
      host: metube.shakir.cloud
      ingressClassName: traefik
    persistence:
      enabled: true
      size: 200Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/metube
