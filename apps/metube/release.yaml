apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metube
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: metube

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: metube
      replicaCount: 1
      image:
        repository: ghcr.io/alexta69/metube
        pullPolicy: IfNotPresent
        tag: "2026.10.27@sha256:845a67373a9f9e62b88e5f9067867202200d63db3615a051acbd77b09e86b9ce" # renovate: depName=ghcr.io/alexta69/metube

      ports:
        - containerPort: 8081
      service:
        ports:
          - port: 80
            targetPort: 8081

      volumeMounts:
        - mountPath: /downloads
          subPath: downloads

    ingress:
      enabled: true
      host: metube.shakir.cloud
      ingressClassName: traefik
    persistence:
      # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
      app:
        enabled: true
        # Keeps the PV/PVC name used before unichart 1.0.0 (default is now <release>-unichart-app-data)
        name: metube-unichart
        size: 200Mi
        accessMode: ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
        nfs:
          server: synology.shakir.cloud
          path: /volume1/k3s-main/metube
