apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: headlamp

  chart:
    spec:
      chart: headlamp
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 2h0m0s

  values:
    # Only overrides are listed; see `helm show values headlamp --repo https://kubernetes-sigs.github.io/headlamp/`
    # Stateless: no persistence needed (persistentVolumeClaim.enabled defaults to false)
    image:
      registry: ghcr.io
      repository: headlamp-k8s/headlamp
      tag: "v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75"

    ingress:
      enabled: true
      ingressClassName: "traefik"
      hosts:
        - host: headlamp.shakir.cloud
          paths:
            - path: /
              type: ImplementationSpecific

    # Uncomment to replace the chart's default cluster-admin binding with cluster-wide read-only access.
    # Secrets stay readable (can be removed if needed). Resources are listed explicitly because a "*" rule would also match
    # pods/exec and nodes/proxy, where "get" is enough to run commands. New CRD groups must be added here.
    # roleRef is immutable: on an installed release, run `kubectl delete clusterrolebinding headlamp-admin` first.
    # clusterRoleBinding:
    #   clusterRoleName: headlamp-read-only
    # extraManifests:
    #   - |
    #     apiVersion: rbac.authorization.k8s.io/v1
    #     kind: ClusterRole
    #     metadata:
    #       name: headlamp-read-only
    #     rules:
    #       - apiGroups: [""]
    #         resources:
    #           - componentstatuses
    #           - configmaps
    #           - endpoints
    #           - events
    #           - limitranges
    #           - namespaces
    #           - nodes
    #           - persistentvolumeclaims
    #           - persistentvolumes
    #           - pods
    #           - pods/log
    #           - podtemplates
    #           - replicationcontrollers
    #           - resourcequotas
    #           - secrets
    #           - serviceaccounts
    #           - services
    #         verbs: ["get", "list", "watch"]
    #       - apiGroups:
    #           - admissionregistration.k8s.io
    #           - apiextensions.k8s.io
