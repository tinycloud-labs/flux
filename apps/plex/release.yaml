  chart:
    spec:
      chart: storage
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    labels:
      app: plex
    annotations:
      volume.kubernetes.io/description: "Plex media library (/data)"

    persistence:
      name: plex-mediaserver-nfs
      size: 100Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/mediaserver

---
