apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: apps
spec:
  interval: 1h0m0s
  releaseName: paperless-ngx
  dependsOn:
    - name: paperless-ngx-data
      namespace: apps
  chart:
    spec:
      chart: paperless-ngx
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  # Note: Image tags are set only here (Renovate updates them, with digests). The
  # chart's values.yaml defaults are fallbacks, which the chart repo's Renovate
  # leaves alone
  values:
    paperlessngx:
      image:
        repository: ghcr.io/paperless-ngx/paperless-ngx
        pullPolicy: IfNotPresent
        tag: "3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9"
      replicaCount: 1

      env:
        - name: PAPERLESS_URL
          value: "https://paperless.shakir.cloud"
        - name: PAPERLESS_TIME_ZONE
          value: "America/Los_Angeles"
        - name: PAPERLESS_OCR_LANGUAGE
          value: "eng"
        - name: "PAPERLESS_OCR_LANGUAGES"
          value: "ara"
        - name: PAPERLESS_FILENAME_FORMAT
          value: "{{ correspondent }}/{{ created_year }}-{{ created_month }}-{{ title }}"
        # v3 renamed PAPERLESS_CONSUMER_POLLING. Polling, because inotify
        # doesn't see changes on the NFS share
        - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
          value: "30"
        # v3 keeps duplicates by default; this restores v2's rejection
        - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
          value: "true"
        # Required since v3 (bootstrap/bw-secrets/apps.yaml)
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secret-key
              key: secret-key

    adminSecret:
      enabled: true
      create: true
      name: paperless-initialization
      usernameKey: paperless-username
      passwordKey: paperless-password
      username: admin
      password: changeme

    redis:
      image:
        repository: docker.io/library/redis
        pullPolicy: IfNotPresent
        tag: "8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53"

    persistence:
      shared:
        existingClaim: paperless-ngx-data

    ingress:
      enabled: true
      host: paperless.shakir.cloud
      ingressClassName: traefik
      annotations: {}

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx-data
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: paperless-ngx-data

  chart:
    spec:
      chart: nfspersistence
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    labels:
      app: paperless-ngx
    annotations:
      volume.kubernetes.io/description: "Shared PVC for paperless-ngx"
      custom.synology/path-hint: "maps to /vol1/k3s-main/paperless-ngx"

    persistence:
      name: paperless-ngx-data
      size: 100Mi
      accessMode: ReadWriteMany
      reclaimPolicy: Retain
      nfs:
        server: synology.shakir.cloud
        path: /volume1/k3s-main/paperless-ngx
