apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omnitools
  namespace: default

spec:
  interval: 1h0m0s
  releaseName: omnitools

  chart:
    spec:
      chart: unichart
      version: "0.0.7"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: omnitools
      replicaCount: 1
      image:
        repository: iib0011/omni-tools
        pullPolicy: IfNotPresent
        tag: "0.6@sha256:ceb5acc317daf387634f7f212cefe4722fd1243ad1cba74203f25254195b6c69" # renovate: depName=iib0011/omni-tools

      containerPort: 80

      service:
        port: 80
        targetPort: 80

    ingress:
      enabled: true
      host: omnitools.shakir.cloud
      ingressClassName: traefik
