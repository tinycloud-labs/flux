apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omnitools
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: omnitools

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: omnitools
      replicaCount: 1
      image:
        repository: iib0011/omni-tools
        pullPolicy: IfNotPresent
        tag: "0.7@sha256:85f0e052a97326396c753e39de0ef74631c0783999ccca81ebc36262903ec9fa" # renovate: depName=iib0011/omni-tools

      ports:
        - containerPort: 80
      service:
        ports:
          - port: 80
            targetPort: 80

    ingress:
      enabled: true
      host: omnitools.shakir.cloud
      ingressClassName: traefik

    ## ------------ Persistence ------------ ##
    persistence:
      app:
        enabled: false
