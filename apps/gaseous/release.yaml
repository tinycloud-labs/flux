apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gaseous
  namespace: apps

spec:
  interval: 1h0m0s
  releaseName: gaseous

  chart:
    spec:
      chart: unichart
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tinycloud-labs
        namespace: flux-system
      interval: 2h0m0s

  values:
    app:
      name: gaseous
      replicaCount: 1
      image:
        repository: gaseousgames/gaseousserver
        tag: "latest@sha256:5e506593ff09533f23e742470da2ef37ffe4051f3559dad3b038e81444df75a6"
        pullPolicy: IfNotPresent

      ports:
        - containerPort: 5198
      service:
        ports:
          - port: 80
            targetPort: 5198

      volumeMounts:
        - mountPath: /root/.gaseous-server
          subPath: gs

      dbHostname: dbhost

      envFromSecrets:
        enabled: true
        secretRefNames:
          - gaseous-server

    ingress:
      enabled: true
      host: gaseous.shakir.cloud
      port: 80
      ingressClassName: traefik

    ## ------------ StatefulSet Specifications ------------ ##
    database:
      replicaCount: 1
      enabled: true
      host: gsdb
      port: 3306
      # bad look but whatever
      env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        - name: MARIADB_ROOT_PASSWORD
          value: gaseous
        - name: MARIADB_USER
          value: gaseous
        - name: MARIADB_PASSWORD
          value: gaseous
        - name: MARIADB_DISABLE_CHOWN
          value: "yes"

      image:
        repository: mariadb
        tag: "latest@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39"

      volumeMounts:
        - mountPath: /var/lib/mysql
          subPath: gsdb

    ## ------------ Persistence ------------ ##
    persistence:
      # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
      app:
        enabled: true
        size: 200Mi
        accessMode: ReadWriteMany
        reclaimPolicy: Retain
        storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
        nfs:
          server: synology.shakir.cloud
          path: /volume1/k3s-main/gaseous
      # -- Database (StatefulSet): moves to Proxmox CSI, one disk per replica via volumeClaimTemplates --
      database:
        size: 512Mi
        accessMode: ReadWriteOnce
        storageClassName: proxmox-retain
        # Binds to an existing disk
        existingVolume:
          handle: "homelab/pve1/tank/vm-9999-pvc-686ff75e-0907-4423-86a8-b8e043bd33c3"
          fsType: xfs
          volumeAttributes:
            backup: "0"
            discard: "on"
            iothread: "1"
            replicate: "0"
            ssd: "1"
            storage: tank
